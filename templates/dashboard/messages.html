<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Messages</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
	</head>
	<body class="bg-white text-zinc-800">
		<div x-data="chat_app()" x-cloak class="h-screen w-full flex overflow-hidden">
			{% include 'components/messaging-sidebar.html' %}
			{% include 'components/messaging-content.html' %}
			{% include 'components/messaging-upload-modal.html' %}
			<div class="fixed top-6 right-6 z-100 flex flex-col gap-3">
				<template x-for="client in new_clients" :key="client.uuid">
					<div class="border border-gray-200 bg-white shadow-sm text-sm rounded-lg px-4 py-3 max-w-xl">
						<h6 class="font-medium text-md"><span class="italic" x-text="client.fullname"></span> Sent you a message</h6>
						<p class="text-xs text-gray-500">You have a new inquiry waiting for your response.</p>
						<button @click="accept_client(client.uuid)" class="px-2 py-1 mt-1 bg-green-700 hover:bg-green-800 transition cursor-pointer text-xs text-white rounded">Accept</button>
					</div>
				</template>
			</div>
		</div>
		<script src="{{ url_for('live_messages.static', filename='js/socketio.js') }}"></script>
		<script src="{{ url_for('live_messages.static', filename='js/chat.js') }}"></script>
	</body>
</html>
