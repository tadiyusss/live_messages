<section class="flex-1 md:flex flex-col min-w-0 bg-white" :class="mobile_view === 'list' ? 'hidden md:flex' : 'flex'">
	<div class="flex flex-col h-full min-h-0">
		<div class="flex items-center gap-3 px-4 sm:px-6 py-4 border-b border-zinc-200 bg-white/95 backdrop-blur">
			<button @click="mobile_view = 'list'" class="md:hidden w-8 h-8 flex items-center justify-center rounded-full hover:bg-zinc-100 shrink-0 text-zinc-600">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="15 18 9 12 15 6" />
				</svg>
			</button>
			<div class="min-w-0 flex-1">
				<p class="font-display font-semibold text-sm text-zinc-950 truncate" x-text="selected_client ? selected_client.fullname : 'Select a client'">John Doe</p>
				<p class="text-xs text-emerald-600">Online</p>
			</div>
			<div class="flex items-center gap-1 shrink-0">
				<button class="w-9 h-9 rounded-full hover:bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-900 transition">
					<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<circle cx="12" cy="12" r="1" />
						<circle cx="19" cy="12" r="1" />
						<circle cx="5" cy="12" r="1" />
					</svg>
				</button>
			</div>
		</div>
		<div class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-4" x-ref="messagesContainer">
			<template x-for="message in messages" :key="message.uuid">
				<div class="flex" :class="message.sender === 'client' ? 'justify-start' : 'justify-end'">
					<div class="max-w-[80%] sm:max-w-[65%] flex flex-col" :class="message.sender === 'client' ? 'items-start' : 'items-end'">
						<template x-if="message.content_type === 'image'">
							<a :href="'/media/' + message.content" target="_blank" class="block">
								<img :src="'/media/' + message.content" alt="Shared image" class="max-h-56 w-auto max-w-full rounded-2xl" :class="message.sender === 'client' ? 'rounded-bl-md' : 'rounded-br-md'" />
							</a>
						</template>
						<template x-if="message.content_type === 'file'">
							<a :href="'/media/' + message.content" target="_blank" class="flex items-center gap-2 px-4 py-2.5 rounded-2xl text-sm underline break-all" :class="message.sender === 'client'
							? 'bg-zinc-100 text-zinc-800 rounded-bl-md'
							: 'bg-zinc-900 text-white rounded-br-md'" x-text="message.content_name"></a>
						</template>
						<template x-if="message.content_type === 'text'">
							<div class="px-4 py-2.5 rounded-2xl text-sm leading-relaxed break-words" :class="message.sender === 'client'
							? 'bg-zinc-100 text-zinc-800 rounded-bl-md'
							: 'bg-zinc-900 text-white rounded-br-md'" x-text="message.content"></div>
						</template>
						<p class="text-[10px] text-zinc-400 mt-1 px-1" x-text="message.created_at"></p>
					</div>
				</div>
			</template>
            <div class="flex justify-center" x-show="selected_client === null">
				<span class="text-[11px] text-gray-800 bg-gray-100 px-3 py-1 rounded-full">To start a conversation, select a client on the left.</span>
			</div>
			<div class="flex justify-center" x-show="connected == false">
				<span class="text-[11px] text-red-800 bg-red-100 px-3 py-1 rounded-full">You are disconnected from the server.</span>
			</div>
		</div>

		<div class="border-t border-zinc-200 p-3 sm:p-4">
			<form class="flex items-center gap-2" @submit.prevent="send_message()">
				<button type="button" @click="show_upload_modal = true" :disabled="!connected" class="w-10 h-10 rounded-full hover:bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-900 transition shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
					</svg>
				</button>
				<input type="text" x-model="new_message" placeholder="Type a message..." class="flex-1 border border-zinc-200 bg-zinc-100 rounded-full px-4 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none focus:ring-1 focus:ring-zinc-800/40 transition disabled:opacity-50 disabled:cursor-not-allowed" :disabled="!connected"/>
				<button type="submit" :disabled="!new_message.trim()" class="w-10 h-10 rounded-full bg-zinc-900 text-white flex items-center justify-center shrink-0 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-zinc-700 transition">
					<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
						<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
					</svg>
				</button>
			</form>
		</div>
	</div>
</section>
