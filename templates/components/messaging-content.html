<section class="flex-1 md:flex flex-col min-w-0 bg-white" :class="mobileView === 'list' ? 'hidden md:flex' : 'flex'">
	<template x-if="activeContact">
		<div class="flex flex-col h-full min-h-0">
			<div class="flex items-center gap-3 px-4 sm:px-6 py-4 border-b border-zinc-200 bg-white/95 backdrop-blur">
				<button @click="mobileView = 'list'" class="md:hidden w-8 h-8 flex items-center justify-center rounded-full hover:bg-zinc-100 shrink-0 text-zinc-600">
					<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
						<polyline points="15 18 9 12 15 6" />
					</svg>
				</button>
				<img :src="activeContact.avatar" :alt="activeContact.name" class="w-10 h-10 rounded-full object-cover shrink-0" />
				<div class="min-w-0 flex-1">
					<p class="font-display font-semibold text-sm text-zinc-950 truncate" x-text="activeContact.name"></p>
					<p class="text-xs" :class="activeContact.online ? 'text-emerald-600' : 'text-zinc-400'" x-text="typing ? 'typing…' : (activeContact.online ? 'Online' : 'Offline')"></p>
				</div>
				<div class="flex items-center gap-1 shrink-0">
					<button class="w-9 h-9 rounded-full hover:bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-900 transition">
						<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z" />
						</svg>
					</button>
					<button class="w-9 h-9 rounded-full hover:bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-900 transition">
						<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<polygon points="23 7 16 12 23 17 23 7" />
							<rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
						</svg>
					</button>
					<button class="w-9 h-9 rounded-full hover:bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-900 transition">
						<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="1" />
							<circle cx="19" cy="12" r="1" />
							<circle cx="5" cy="12" r="1" />
						</svg>
					</button>
				</div>
			</div>
			<div class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-4" x-ref="messagesContainer">
				<div class="flex justify-center">
					<span class="text-[11px] text-zinc-400 bg-zinc-100 px-3 py-1 rounded-full">Today</span>
				</div>
				<template x-for="m in currentMessages" :key="m.id">
					<div class="flex" :class="m.sender === 'me' ? 'justify-end' : 'justify-start'">
						<div class="max-w-[80%] sm:max-w-[65%] flex flex-col" :class="m.sender === 'me' ? 'items-end' : 'items-start'">
							<div class="px-4 py-2.5 rounded-2xl text-sm leading-relaxed break-words" :class="m.sender === 'me'
                    ? 'bg-zinc-900 text-white rounded-br-md'
                    : 'bg-zinc-100 text-zinc-800 rounded-bl-md'" x-text="m.text"></div>
							<p class="text-[10px] text-zinc-400 mt-1 px-1" x-text="m.time"></p>
						</div>
					</div>
				</template>
				<div class="flex justify-start" x-show="typing" x-cloak>
					<div class="bg-zinc-100 rounded-2xl rounded-bl-md px-4 py-3 flex items-center gap-1">
						<span class="w-1.5 h-1.5 rounded-full bg-zinc-400 animate-bounce" style="animation-delay:0ms"></span>
						<span class="w-1.5 h-1.5 rounded-full bg-zinc-400 animate-bounce" style="animation-delay:150ms"></span>
						<span class="w-1.5 h-1.5 rounded-full bg-zinc-400 animate-bounce" style="animation-delay:300ms"></span>
					</div>
				</div>
			</div>
			<div class="border-t border-zinc-200 p-3 sm:p-4">
				<form @submit.prevent="send()" class="flex items-center gap-2">
					<button type="button" class="w-10 h-10 rounded-full hover:bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-zinc-900 transition shrink-0">
						<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
						</svg>
					</button>
					<input type="text" x-model="newMessage" placeholder="Type a message..." class="flex-1 bg-zinc-100 rounded-full px-4 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none focus:ring-2 focus:ring-zinc-900/15 transition" />
					<button type="submit" :disabled="!newMessage.trim()" class="w-10 h-10 rounded-full bg-zinc-900 text-white flex items-center justify-center shrink-0 disabled:opacity-30 disabled:cursor-not-allowed hover:bg-zinc-700 transition">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
							<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
						</svg>
					</button>
				</form>
			</div>
		</div>
	</template>
</section>
