<aside class="w-full md:w-[22rem] lg:w-[24rem] shrink-0 md:flex flex-col border-r border-zinc-200 bg-gray-50" :class="mobileView === 'chat' ? 'hidden md:flex' : 'flex'">
	<div class="px-5 pt-6 pb-4">
		<div class="flex items-center justify-between mb-5">
			<div class="flex items-center space-x-2"> 
                {% if g.settings['website_logo'] %} 
                    <img src="{{ url_for('media.serve_media', filename=g.settings['website_logo']) }}" alt="Website Logo" class="size-10 rounded object-cover bg-zinc-700"> 
                {% else %} 
                    <img src="{{ url_for('static', filename='images/default-logo.png') }}" alt="Website Logo" class="size-10 rounded object-cover"> 
                {% endif %} 
                <h1 class="font-display text-xl">{{ g.settings['site_title'] }}</h1>
			</div>
			<div x-data="{ dropdown_open: false }" class="relative inline-block text-left">
				<button @click="dropdown_open = !dropdown_open" @click.outside="dropdown_open = false" class="border border-zinc-300 rounded-lg p-1.5 cursor-pointer hover:bg-zinc-200 transition">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4">
						<path d="M8 2a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM8 6.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM9.5 12.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0Z" />
					</svg>
				</button>
				<div x-show="dropdown_open" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 scale-95 -translate-y-1" x-transition:enter-end="opacity-100 scale-100 translate-y-0" x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95" x-cloak class="absolute left-0 mt-2 w-48 origin-top-left bg-white rounded-xl shadow-lg ring-1 ring-zinc-200 z-20 overflow-hidden">
					<div class="py-1">
						<a href="{{ url_for('core.dashboard') }}" @click="dropdown_open = false" class="block px-4 py-2 text-sm text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition">Return to Dashboard</a>
						<a href="{{ url_for('core.logout') }}" @click="dropdown_open = false" class="block px-4 py-2 text-sm text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition">Logout</a>
					</div>
				</div>
			</div>
		</div>

        <div class="relative">
			<svg class="absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<circle cx="11" cy="11" r="8" />
				<line x1="21" y1="21" x2="16.65" y2="16.65" />
			</svg>
			<input type="text" x-model="search" placeholder="Search contacts..." class="w-full bg-zinc-100 border border-zinc-200 rounded-full pl-10 pr-4 py-2.5 text-sm text-zinc-900 placeholder-zinc-400 outline-none focus:ring-1 focus:ring-zinc-900/30 transition" />
		</div>
	</div>
	<div class="flex-1 overflow-y-auto pb-4">
		<button class="relative cursor-pointer w-full flex items-center gap-3 px-5 py-3 text-left transition bg-zinc-200 hover:bg-zinc-200">
			<div class="min-w-0 flex-1">
				<div class="flex items-center justify-between gap-2">
					<p class="text-sm truncate text-zinc-950 font-semibold">John Doe</p>
					<span class="text-[11px] text-zinc-400 shrink-0">9:40 AM</span>
				</div>
				<div class="flex items-center justify-between gap-2 mt-0.5">
					<p class="text-xs truncate text-zinc-600">This is the last message</p>
					<span class="shrink-0 min-w-[18px] h-[18px] px-1 rounded-full bg-zinc-900 text-[10px] font-bold text-white flex items-center justify-center">1</span>
				</div>
			</div>
		</button>
		{% for client in clients %}
			<button class="relative cursor-pointer w-full flex items-center gap-3 px-5 py-3 text-left transition hover:bg-zinc-200">
				<div class="min-w-0 flex-1">
					<div class="flex items-center justify-between gap-2">
						<p class="text-sm truncate text-zinc-700 font-medium">{{ client.fullname }}</p>
						<span class="text-[11px] text-zinc-400 shrink-0">{{ client.last_message.created_at.strftime('%I:%M %p') if client.last_message else '' }}</span>
					</div>
					<div class="flex items-center justify-between gap-2 mt-0.5">
						<p class="text-xs truncate text-zinc-600">{{ client.last_message.content if client.last_message else 'No messages yet' }}</p>
					</div>
				</div>
			</button>
		{% endfor %}
		<p class="px-5 py-6 text-sm text-zinc-400 text-center">No contacts found.</p>
	</div>
</aside>
